[project]
name = "plotsmith"
version = "0.5.0"
description = "Matplotlib figure style following Kieran Healy's practices: direct labels with collision-avoiding placement, a measurable overlap check, per-target export, and a machine-readable digest of every figure's data"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyyaml>=6",
]

[project.scripts]
fig-check = "plotsmith.check:main"
render-digest = "plotsmith.digest:main"

[dependency-groups]
# IPython and the inline backend are the notebook side the digest hooks into;
# the library imports them only when running under a kernel.
dev = ["pytest>=8", "ipython>=8", "matplotlib-inline>=0.1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotsmith"]
