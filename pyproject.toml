[project]
name = "plotsmith"
version = "0.6.0"
description = "Matplotlib figure style inspired by Kieran Healy's Data Visualization: direct labels placed clear of each other and of the data, a measured overlap check, export at each destination's physical size, and a machine-readable digest of every figure's data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Queiró" }]
keywords = ["matplotlib", "figures", "direct labels", "data visualization", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.11"
# The floors are the oldest versions the tests pass with, on the oldest
# Python; CI checks them with `--resolution lowest-direct`.
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/fqueiro/plotsmith"
Issues = "https://github.com/fqueiro/plotsmith/issues"

[project.scripts]
fig-check = "plotsmith.check:main"
render-digest = "plotsmith.digest:main"

[dependency-groups]
# IPython and the inline backend are the notebook side the digest hooks into;
# the library imports them only when running under a kernel. Polars is there
# for the tests that pass its columns to the helpers as they are.
dev = [
    "pytest>=8",
    "ipython>=8",
    "matplotlib-inline>=0.1.7",
    "polars>=1.44.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotsmith"]
