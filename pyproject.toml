[project]
name = "plotsmith"
version = "0.4.0"
description = "Matplotlib figure style following Kieran Healy's practices: direct labels with collision-avoiding placement, a measurable overlap check, and per-target export"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[project.scripts]
fig-check = "plotsmith.check:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotsmith"]
